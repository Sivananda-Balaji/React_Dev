<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin-top: 0;
        margin-bottom: 0;
      }
      .send-button {
        background-color: rgb(25, 135, 84);
        color: #fff;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }
      .chat-input {
        padding: 12px 10px;
        border-width: 1px;
        border-radius: 10px;
        font-size: 15px;
        flex-grow: 1;
      }

      .chat-input-container {
        display: flex;
        margin-bottom: 60px;
      }

      .app-container {
        max-width: 600px;
        margin: 0 auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .chat-messsage-user {
        display: flex;
        justify-content: end;
        align-items: start;
      }
      .chat-message-robot {
        display: flex;
        align-items: start;
      }

      .chat-message-text {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-left: 10px;
        margin-right: 10px;
        margin-bottom: 15px;
        max-width: 200px;
      }

      .chat-message-profile {
        width: 45px;
      }

      .chat-messages-container {
        flex-grow: 1;
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/Chatbot.js"></script>

    <script type="text/babel">
      const ChatInput = ({ chatMessages, setChatMessages, setIsLoading }) => {
        const [inputText, setInputText] = React.useState("");

        const handleInputText = (e) => {
          const { value } = e.target;
          setInputText(value);
        };
        const handleKeyInput = (e) => {
          const { key } = e;
          if (key === "Enter" && inputText.length > 0) {
            handleSend();
          }
          if (key === "Escape") {
            setInputText("");
          }
        };
        const handleSend = async () => {
          if (inputText.length > 0 && inputText !== "") {
            setIsLoading(true);
            setInputText("");
            const userMessage = {
              message: inputText,
              sender: "user",
              id: crypto.randomUUID(),
            };
            const newMessages = [...chatMessages, userMessage];
            const robotLoading = {
              message: "Loading...",
              sender: "robot",
              id: crypto.randomUUID(),
            };
            setChatMessages([...newMessages, robotLoading]);
            const response = await Chatbot.getResponseAsync(inputText);
            const robotMessage = {
              message: response,
              sender: "robot",
              id: crypto.randomUUID(),
            };
            setChatMessages([...newMessages, robotMessage]);
            setIsLoading(false);
          }
        };
        return (
          <div className="chat-input-container">
            <input
              placeholder="send a message to chatbox"
              size="30"
              value={inputText}
              onChange={handleInputText}
              onKeyDown={handleKeyInput}
              className="chat-input"
            />
            <button onClick={handleSend} className="send-button">
              Send
            </button>
          </div>
        );
      };

      const ChatMessage = ({ message, sender, isLoading }) => {
        return (
          <div
            className={
              sender === "user" ? "chat-messsage-user" : "chat-message-robot"
            }
          >
            {sender === "robot" && (
              <img src="../assets/robot.png" className="chat-message-profile" />
            )}
            <div className="chat-message-text">{message}</div>
            {sender === "user" && (
              <img src="../assets/user.png" className="chat-message-profile" />
            )}
          </div>
        );
      };

      const ChatMessages = ({ chatMessages, isLoading }) => {
        const chatMessageRef = React.useRef(null);
        React.useEffect(() => {
          const containerElem = chatMessageRef.current;
          if (containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, [chatMessages]);
        return (
          <div className="chat-messages-container" ref={chatMessageRef}>
            {chatMessages.map(({ message, sender, id }) => {
              return (
                <ChatMessage
                  message={message}
                  sender={sender}
                  key={id}
                  isLoading={isLoading}
                />
              );
            })}
          </div>
        );
      };

      const App = () => {
        const [chatMessages, setChatMessages] = React.useState([
          {
            message: "Hello Chatbot",
            sender: "user",
            id: "id1",
          },
          {
            message: "Hello! How can I help you?",
            sender: "robot",
            id: "id2",
          },
          {
            message: "can you get me today's date?",
            sender: "user",
            id: "id3",
          },
          {
            message: "Today is December 16",
            sender: "robot",
            id: "id4",
          },
        ]);
        const [isLoading, setIsLoading] = React.useState(false);

        return (
          <div className="app-container">
            <ChatMessages chatMessages={chatMessages} isLoading={isLoading} />
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
              isLoading={isLoading}
              setIsLoading={setIsLoading}
            />
          </div>
        );
      };

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
